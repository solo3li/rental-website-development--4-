{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | {{ site_title|default:"سكن طلاب القاهرة" }}{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">سكن طلاب القاهرة — لوحة الإدارة</a>
</div>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script>
        // Polyfill/Shim for Chromium Permissions Policy:
        // Transparently map legacy 'unload' listener in RelatedObjectLookups.js to modern 'pagehide'
        (function() {
            var orig = window.addEventListener;
            window.addEventListener = function(event, fn, opts) {
                if (event === 'unload') {
                    return orig.call(window, 'pagehide', fn, opts);
                }
                return orig.call(window, event, fn, opts);
            };
        })();
    </script>
    <style>
        /* Minimalist tweaks: Ensure badges and action buttons never wrap vertically */
        .status-badge, .badge-clean {
            white-space: nowrap !important;
            display: inline-block !important;
            vertical-align: middle !important;
            line-height: 1.4 !important;
        }
    </style>
{% endblock %}
